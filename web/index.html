<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>A Casa que Lembra — 8-bit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="pixel-bg" aria-hidden="true">
      <div class="pixel-bg__grid"></div>
      <div class="pixel-bg__vignette"></div>
      <div class="pixel-bg__scan"></div>
    </div>

    <main class="shell">
      <header class="hud bit-box">
        <div class="hud__brand">
          <span class="hud__eyebrow">RPG · TERROR</span>
          <h1 class="bit-title">A CASA QUE LEMBRA</h1>
        </div>
        <div class="hud__stats" id="hud-stats">
          <span class="bit-stat"><em>VIDA</em><strong id="stat-vida" aria-label="3 de vida">♥♥♥</strong></span>
          <span class="bit-stat"><em>TURNOS</em><strong id="stat-turnos">0/15</strong></span>
        </div>
      </header>

      <section class="stage bit-box" id="stage">
        <div class="stage__art" id="stage-art" data-scene="inicio">
          <img src="art/scene-inicio.jpg" alt="" id="scene-img" width="960" height="640" />
          <span class="stage__loc retro" id="scene-loc">QUARTO</span>
        </div>
        <div class="stage__log" id="log" aria-live="polite"></div>
        <div class="stage__inv bit-box bit-box--inset">
          <span class="retro label">INVENTARIO</span>
          <p id="inv">nada</p>
        </div>
        <div class="stage__choices" id="choices"></div>
      </section>

      <footer class="footer retro">
        Visual 8-bit dark · uma arte por fase · uma arte por escolha
      </footer>
    </main>

    <div class="boot" id="boot">
      <div class="boot__inner bit-box">
        <img src="art/scene-espelho.jpg" alt="" class="boot__art" width="160" height="160" />
        <p class="boot__sub retro">O rastro esta vivo</p>
        <h2 class="bit-title boot__title">A CASA QUE LEMBRA</h2>
        <p class="boot__line retro" id="boot-line">Carregando memoria...</p>
        <div class="boot__bar"><div class="boot__bar-fill" id="boot-bar"></div></div>
        <button type="button" class="bit-btn" id="btn-start" hidden>▶ COMECAR</button>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
