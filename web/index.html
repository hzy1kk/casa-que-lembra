<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#030304" />
    <meta name="description" content="A Casa que Lembra — terror em texto. Você acorda no quarto de infância. Algo com o seu rosto caminha nos corredores." />
    <title>A Casa que Lembra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-hp="3" data-scene="boot">
    <svg class="svg-filters" aria-hidden="true" focusable="false">
      <filter id="green-to-red" color-interpolation-filters="sRGB">
        <feColorMatrix
          type="matrix"
          values="1 0.9 0 0 0
                  0 0.12 0 0 0
                  0 0.08 0.85 0 0
                  0 0 0 1 0"
        />
      </filter>
    </svg>
    <div class="fx" aria-hidden="true">
      <div class="fx__grain"></div>
      <div class="fx__vignette"></div>
      <div class="fx__scan"></div>
      <div class="fx__fade" id="fx-fade"></div>
    </div>

    <main class="shell">
      <header class="hud">
        <div class="hud__brand">
          <span class="hud__eyebrow">terror · 15 respirações</span>
          <h1 class="hud__title">A Casa que Lembra</h1>
        </div>
        <div class="hud__right">
          <div class="hud__stats" id="hud-stats">
            <span class="stat" id="stat-vida-wrap">
              <em>vida</em>
              <strong id="stat-vida" aria-label="3 de vida">♥♥♥</strong>
            </span>
            <span class="stat stat--turns">
              <em>contagem</em>
              <strong id="stat-turnos">0/15</strong>
              <span class="stat__bar" aria-hidden="true"><span id="turn-bar"></span></span>
            </span>
          </div>
          <button type="button" class="mute" id="btn-mute" aria-pressed="false" title="Som">
            som
          </button>
        </div>
      </header>

      <section class="stage" id="stage">
        <div class="stage__art" id="stage-art" data-scene="inicio">
          <img src="art/scene-inicio.jpg" alt="" id="scene-img" width="960" height="640" />
          <div class="stage__art-shade"></div>
          <span class="stage__loc" id="scene-loc">QUARTO</span>
          <span class="stage__echo" aria-hidden="true" id="scene-echo"></span>
        </div>

        <div class="stage__text">
          <div class="stage__log" id="log" aria-live="polite"></div>
          <p class="stage__skip" id="skip-hint" hidden>clique ou pressione espaço para adiantar</p>
        </div>

        <div class="stage__inv">
          <span class="stage__inv-label">nas mãos</span>
          <div id="inv" class="inv-list"><span class="inv-empty">nada</span></div>
        </div>

        <div class="stage__choices" id="choices"></div>
      </section>

      <footer class="footer">A casa conta até quinze. Depois, ela escolhe por você.</footer>
    </main>

    <div class="boot" id="boot">
      <div class="boot__inner">
        <img src="art/scene-espelho.jpg" alt="" class="boot__art" width="320" height="180" />
        <p class="boot__sub">doze anos vazia</p>
        <h2 class="boot__title">A Casa que Lembra</h2>
        <p class="boot__line" id="boot-line">O reflexo ainda não chegou…</p>
        <div class="boot__bar"><div class="boot__bar-fill" id="boot-bar"></div></div>
        <button type="button" class="bit-btn" id="btn-start" hidden>entrar</button>
        <p class="boot__warn">há som. a casa respira baixo.</p>
      </div>
    </div>

    <script src="audio.js"></script>
    <script src="game.js"></script>
  </body>
</html>
