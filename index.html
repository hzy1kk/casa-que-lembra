<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050306" />
    <title>A Casa que Lembra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,500;0,7..72,650;1,7..72,500&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="image" href="/assets/imagens/corredor.webp" type="image/webp" />
    <link rel="preload" as="image" href="/assets/imagens/inicio.webp" type="image/webp" />
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>
    <style>
      :root {
        --bg: #050306;
        --ink: #f2ebe1;
        --muted: #9a9086;
        --blood: #7a1f28;
        --blood-hot: #d03a46;
        --panel: rgba(8, 6, 8, 0.88);
        --line: rgba(196, 64, 72, 0.32);
        --glow: rgba(160, 32, 40, 0.35);
        --font-story: "Literata", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
        --font-ui: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-story);
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      body {
        min-height: 100dvh;
        background:
          radial-gradient(ellipse 80% 55% at 50% 0%, rgba(90, 18, 28, 0.28), transparent 55%),
          var(--bg);
      }

      .hidden { display: none !important; }

      button {
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }

      /* ---------- LOADING ---------- */
      #loading {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: grid;
        place-items: center;
        background: #050306;
        font-family: var(--font-ui);
        font-size: 0.78rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }
      #loading.hidden { display: none; }
      #loading span {
        animation: pulseSoft 1.4s ease-in-out infinite;
      }

      /* ---------- BOOT ---------- */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: grid;
        place-items: stretch;
        overflow: hidden;
      }
      #boot.hidden { display: none; }

      #boot-bg {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(5,3,6,0.18) 0%, rgba(5,3,6,0.28) 40%, rgba(5,3,6,0.9) 74%, #050306 100%),
          center / cover no-repeat url("/assets/imagens/corredor.webp");
        background-image:
          linear-gradient(180deg, rgba(5,3,6,0.18) 0%, rgba(5,3,6,0.28) 40%, rgba(5,3,6,0.9) 74%, #050306 100%),
          image-set(
            url("/assets/imagens/corredor.webp") type("image/webp"),
            url("/assets/imagens/corredor.jpg") type("image/jpeg")
          );
        background-position: center;
        background-size: cover;
        background-repeat: no-repeat;
        transform: scale(1.04);
        transform-origin: center 40%;
      }

      @media (min-width: 900px) and (prefers-reduced-motion: no-preference) {
        #boot-bg {
          animation: kenBurns 32s ease-in-out infinite alternate;
        }
      }

      #boot-vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 25%, rgba(0,0,0,0.55) 100%);
      }

      #boot-content {
        position: relative;
        z-index: 2;
        align-self: end;
        justify-self: stretch;
        width: 100%;
        padding: 1.1rem clamp(1rem, 4vw, 2.5rem) 1.35rem;
        text-align: left;
        display: grid;
        grid-template-columns: 1.4fr 0.9fr;
        gap: 1rem 2rem;
        align-items: end;
        background: linear-gradient(180deg, transparent, rgba(0,0,0,0.72) 30%, rgba(0,0,0,0.92));
        animation: riseIn 0.9s ease both;
      }

      #boot-copy { min-width: 0; }

      #boot-icon {
        margin: 0 0 0.2rem;
        font-size: 1.15rem;
        color: var(--blood-hot);
        opacity: 0.9;
      }

      #boot-title {
        margin: 0;
        font-size: clamp(2.4rem, 7vw, 4rem);
        font-weight: 650;
        letter-spacing: -0.01em;
        line-height: 0.94;
        text-shadow: 0 0 40px var(--glow), 0 8px 30px rgba(0,0,0,0.8);
      }

      #boot-sub {
        margin: 0.55rem 0 0;
        color: #cfc4b8;
        font-style: italic;
        font-weight: 500;
        font-size: clamp(1.08rem, 2.5vw, 1.35rem);
        line-height: 1.35;
        max-width: 28ch;
      }

      #boot-author {
        margin: 0.55rem 0 0;
        font-family: var(--font-ui);
        font-size: 0.72rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--blood-hot);
      }

      #boot-side {
        display: flex;
        flex-direction: column;
        gap: 0.55rem;
        width: 100%;
      }

      #boot-actions {
        display: flex;
        flex-direction: column;
        gap: 0.45rem;
        width: 100%;
        margin: 0;
      }

      #ranking-box {
        margin-top: 0;
        text-align: left;
        background: rgba(0,0,0,0.45);
        border: 1px solid var(--line);
        padding: 0.55rem 0.7rem;
      }

      #ranking-box > p {
        margin: 0 0 0.4rem;
        font-family: var(--font-ui);
        font-size: 0.62rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--blood-hot);
      }

      #ranking-lista {
        margin: 0;
        padding-left: 1.1rem;
        font-family: var(--font-ui);
        font-size: 0.7rem;
        color: var(--muted);
      }

      /* ---------- APP / STAGE ---------- */
      #app {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
      }
      #app.visible { display: block; }

      #stage {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: #000;
      }

      #cena-imagem,
      #cena-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        display: block;
        background: #0a0708;
      }

      #cena-imagem {
        opacity: 1;
        transform: scale(1.02);
        transform-origin: 50% 40%;
      }

      @media (min-width: 900px) and (prefers-reduced-motion: no-preference) {
        #cena-imagem.anim-on {
          animation: kenBurnsSlow 26s ease-in-out infinite alternate;
        }
      }

      #cena-imagem.is-fade,
      #cena-video.is-fade { opacity: 0; }

      #cena-imagem,
      #cena-video {
        transition: opacity 280ms ease;
      }

      #stage-fx {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 2;
        background:
          linear-gradient(180deg, rgba(0,0,0,0.5) 0%, transparent 20%, transparent 52%, rgba(0,0,0,0.84) 100%),
          radial-gradient(ellipse at center, transparent 42%, rgba(0,0,0,0.5) 100%);
      }

      #flash-dano {
        position: absolute;
        inset: 0;
        z-index: 4;
        pointer-events: none;
        background: rgba(140, 16, 24, 0.45);
        opacity: 0;
      }
      #flash-dano.on {
        animation: hitFlash 420ms ease-out;
      }

      /* ---------- HUD ---------- */
      #hud {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 12;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 0.5rem;
        padding: max(0.55rem, env(safe-area-inset-top)) 0.75rem 0.55rem;
        background: linear-gradient(180deg, rgba(0,0,0,0.78), transparent);
        font-family: var(--font-ui);
      }

      #hud-brand {
        display: flex;
        flex-direction: column;
        gap: 0.1rem;
        min-width: 0;
        flex: 1 1 auto;
      }

      #titulo-jogo {
        margin: 0;
        font-family: var(--font-story);
        font-size: clamp(1.05rem, 2.6vw, 1.35rem);
        font-weight: 650;
        letter-spacing: 0.01em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #autor-jogo {
        margin: 0;
        font-size: 0.6rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }

      #hud-stats {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 0.35rem;
        max-width: 70%;
      }

      .stat-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.28rem 0.55rem;
        border: 1px solid var(--line);
        background: rgba(0,0,0,0.55);
        font-size: 0.65rem;
        letter-spacing: 0.04em;
        color: var(--muted);
        backdrop-filter: blur(6px);
      }

      .stat-pill strong {
        color: var(--ink);
        font-weight: 500;
      }

      .stat-pill.vida strong { color: var(--blood-hot); }
      .stat-pill.vida.low {
        border-color: var(--blood-hot);
        animation: pulseSoft 1s ease-in-out infinite;
      }

      #btn-mute,
      #btn-reiniciar {
        font-family: var(--font-ui);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        cursor: pointer;
        border: 1px solid var(--line);
        background: rgba(0,0,0,0.55);
        color: var(--ink);
        min-height: 34px;
        padding: 0.3rem 0.55rem;
        font-size: 0.62rem;
      }

      #btn-mute:hover,
      #btn-reiniciar:hover {
        border-color: var(--blood-hot);
        color: #fff;
        background: rgba(122, 31, 40, 0.55);
      }

      /* ---------- DIALOGUE DOCK ---------- */
      #dock {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 12;
        padding: 0;
        display: block;
        pointer-events: none;
      }

      #painel {
        pointer-events: auto;
        width: 100%;
        max-width: none;
        background: rgba(8, 6, 8, 0.94);
        border: none;
        border-top: 1px solid var(--line);
        box-shadow: 0 -24px 60px rgba(0,0,0,0.55);
        padding: 0.55rem clamp(0.75rem, 3vw, 1.4rem) max(0.55rem, env(safe-area-inset-bottom));
        display: grid;
        grid-template-columns: 1fr;
        gap: 0.4rem;
        animation: dockIn 0.4s ease both;
      }

      @supports ((backdrop-filter: blur(8px)) or (-webkit-backdrop-filter: blur(8px))) {
        @media (min-width: 900px) {
          #painel {
            background: linear-gradient(180deg, rgba(8,6,8,0.58), rgba(8,6,8,0.94) 24%);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
          }
        }
      }

      #painel.is-swap {
        animation: dockSwap 0.38s ease both;
      }

      #narrativa {
        min-width: 0;
        display: grid;
        gap: 0.28rem;
        align-content: start;
      }

      #narrativa-top {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 0.35rem 0.75rem;
      }

      #acoes-wrap {
        min-width: 0;
        display: grid;
        gap: 0.35rem;
        align-content: start;
      }

      #cena-titulo {
        margin: 0;
        font-family: var(--font-ui);
        font-size: 0.72rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--blood-hot);
      }

      #cena-texto {
        margin: 0;
        max-height: min(22vh, 160px);
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        white-space: pre-wrap;
        font-size: clamp(1.14rem, 2.4vw, 1.38rem);
        font-weight: 500;
        line-height: 1.38;
        letter-spacing: 0.01em;
        color: var(--ink);
      }

      #inv-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.3rem;
        min-height: 0;
        justify-content: flex-end;
      }

      .inv-chip {
        font-family: var(--font-ui);
        font-size: 0.62rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 0.22rem 0.45rem;
        border: 1px solid rgba(196, 64, 72, 0.4);
        background: rgba(122, 31, 40, 0.22);
        color: #d8cfc4;
        animation: chipIn 0.35s ease both;
      }

      #opcoes {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.4rem;
      }

      .opt-btn,
      #btn-iniciar,
      #btn-continuar {
        font-family: var(--font-ui);
        letter-spacing: 0.05em;
        text-transform: uppercase;
        cursor: pointer;
        border: 1px solid var(--blood);
        background: rgba(18, 8, 10, 0.9);
        color: var(--ink);
        transition: background 0.15s ease, transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      }

      #btn-iniciar,
      #btn-continuar {
        min-height: 48px;
        padding: 0.75rem 1rem;
        font-size: 0.8rem;
      }

      #btn-iniciar {
        background: linear-gradient(180deg, #9a2a34, #6e1c24);
        border-color: #c43340;
        box-shadow: 0 0 24px rgba(160, 32, 40, 0.35);
      }

      #btn-continuar { background: transparent; }

      .opt-btn {
        width: 100%;
        min-height: 46px;
        padding: 0.65rem 0.8rem;
        text-align: left;
        font-size: 0.74rem;
        opacity: 0;
        transform: translateY(8px);
      }

      .opt-btn.show {
        opacity: 1;
        transform: translateY(0);
        transition: opacity 0.28s ease, transform 0.28s ease, background 0.15s ease, border-color 0.15s ease;
      }

      .opt-btn:nth-child(1).show { transition-delay: 0.03s; }
      .opt-btn:nth-child(2).show { transition-delay: 0.08s; }
      .opt-btn:nth-child(3).show { transition-delay: 0.13s; }
      .opt-btn:nth-child(4).show { transition-delay: 0.18s; }

      .opt-btn.hidden { display: none; }

      #btn-iniciar:hover,
      #btn-continuar:hover,
      .opt-btn:hover {
        background: var(--blood-hot);
        border-color: #e04a55;
        color: #fff;
        transform: translateY(-1px);
        box-shadow: 0 8px 24px rgba(160, 32, 40, 0.35);
      }

      #rodape-acoes {
        display: flex;
        justify-content: flex-end;
      }

      #audio-player { display: none; }

      /* ---------- MOTION ---------- */
      @keyframes kenBurns {
        from { transform: scale(1.05) translate3d(0, 0, 0); }
        to { transform: scale(1.14) translate3d(-1.5%, 1%, 0); }
      }
      @keyframes kenBurnsSlow {
        from { transform: scale(1.02); }
        to { transform: scale(1.1) translate3d(-1%, 0.5%, 0); }
      }
      @keyframes riseIn {
        from { opacity: 0; transform: translateY(24px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes dockIn {
        from { opacity: 0; transform: translateY(28px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes dockSwap {
        0% { opacity: 0.35; transform: translateY(10px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes chipIn {
        from { opacity: 0; transform: scale(0.9); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes pulseSoft {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
      @keyframes flicker {
        0%, 100% { opacity: 1; }
        92% { opacity: 1; }
        93% { opacity: 0.86; }
        94% { opacity: 1; }
        96% { opacity: 0.9; }
      }
      @keyframes hitFlash {
        0% { opacity: 0.7; }
        100% { opacity: 0; }
      }

      @media (max-height: 700px) {
        #cena-texto { max-height: 16vh; font-size: 1.08rem; }
        #boot-title { font-size: clamp(2rem, 8vw, 2.8rem); }
      }

      @media (max-width: 720px) {
        #boot-content {
          grid-template-columns: 1fr;
          text-align: left;
          gap: 0.75rem;
          padding: 0.9rem 0.9rem max(0.9rem, env(safe-area-inset-bottom));
        }
        #opcoes { grid-template-columns: 1fr; }
        #hud {
          padding-top: max(0.55rem, env(safe-area-inset-top));
          gap: 0.45rem;
        }
        #hud-stats { max-width: 100%; }
        .stat-pill { font-size: 0.6rem; padding: 0.28rem 0.42rem; }
        .opt-btn {
          font-size: 0.72rem;
          min-height: 48px;
          letter-spacing: 0.04em;
        }
        #cena-texto {
          max-height: min(28vh, 200px);
          font-size: 1.16rem;
          line-height: 1.4;
        }
        #btn-iniciar, #btn-continuar { min-height: 52px; font-size: 0.84rem; }
        #painel.is-swap { animation: none; }
        .opt-btn.show { transition-delay: 0s !important; }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-bg, #cena-imagem, #loading span, .stat-pill.vida.low { animation: none !important; }
        #painel, #painel.is-swap, .opt-btn, .inv-chip { animation: none !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="loading"><span>Carregando a casa…</span></div>

    <div id="boot">
      <div id="boot-bg" aria-hidden="true"></div>
      <div id="boot-vignette" aria-hidden="true"></div>
      <div id="boot-content">
        <div id="boot-copy">
          <div id="boot-icon"></div>
          <h1 id="boot-title">A Casa que Lembra</h1>
          <p id="boot-sub"></p>
          <p id="boot-author"></p>
        </div>
        <div id="boot-side">
          <div id="boot-actions">
            <button type="button" id="btn-iniciar" disabled>Carregando…</button>
            <button type="button" id="btn-continuar" class="hidden">▶ Continuar</button>
          </div>
          <div id="ranking-box">
            <p>Melhores pontuações</p>
            <ol id="ranking-lista"></ol>
          </div>
        </div>
      </div>
    </div>

    <div id="app">
      <div id="stage">
        <img id="cena-imagem" alt="" decoding="async" fetchpriority="high" />
        <video id="cena-video" class="hidden" playsinline preload="none" muted></video>
        <div id="stage-fx"></div>
        <div id="flash-dano"></div>
      </div>

      <header id="hud">
        <div id="hud-brand">
          <h1 id="titulo-jogo">A Casa que Lembra</h1>
          <p id="autor-jogo"></p>
        </div>
        <div id="hud-stats">
          <span class="stat-pill vida">♥ <strong id="stat-vida">3</strong></span>
          <span class="stat-pill">PTS <strong id="stat-pontos">0</strong></span>
          <span class="stat-pill">TURNO <strong id="stat-turnos">0/15</strong></span>
          <button type="button" id="btn-mute" title="Som">🔊 SOM</button>
        </div>
      </header>

      <div id="dock">
        <section id="painel">
          <div id="narrativa">
            <div id="narrativa-top">
              <h2 id="cena-titulo"></h2>
              <div id="inv-bar" aria-label="Inventário"></div>
            </div>
            <p id="cena-texto"></p>
            <div id="status" class="hidden">
              <span>Inventário: <strong id="stat-inv">nada</strong></span>
            </div>
          </div>
          <div id="acoes-wrap">
            <div id="opcoes">
              <button type="button" class="opt-btn hidden" id="opt-0"></button>
              <button type="button" class="opt-btn hidden" id="opt-1"></button>
              <button type="button" class="opt-btn hidden" id="opt-2"></button>
              <button type="button" class="opt-btn hidden" id="opt-3"></button>
            </div>
            <div id="rodape-acoes">
              <button type="button" id="btn-reiniciar">↻ Reiniciar</button>
            </div>
          </div>
        </section>
      </div>

      <audio id="audio-player" loop preload="none"></audio>
    </div>

    <script>
      (function () {
        const bgm = () => document.getElementById("audio-player");
        let muted = false;
        let unlocked = false;
        let currentSrc = "";
        const preloadCache = new Set();
        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const isMobile = window.matchMedia("(max-width: 720px)").matches;

        function absUrl(src) {
          if (!src) return "";
          src = String(src).trim();
          if (/^https?:\/\//i.test(src) || src.startsWith("/")) return src;
          return "/" + src.replace(/^\.\//, "");
        }

        function webpOf(src) {
          const u = absUrl(src);
          if (!u) return "";
          return u.replace(/\.jpe?g$/i, ".webp").replace(/\.png$/i, ".webp");
        }

        function preload(src) {
          const u = absUrl(src);
          if (!u || preloadCache.has(u)) return;
          preloadCache.add(u);
          const img = new Image();
          img.decoding = "async";
          const w = webpOf(u);
          img.onerror = function () {
            if (w && this.src.indexOf(".webp") !== -1) {
              this.onerror = null;
              this.src = u;
            }
          };
          img.src = w || u;
        }

        // Pré-carrega cenas mais usadas
        [
          "/assets/imagens/corredor.webp",
          "/assets/imagens/inicio.webp",
          "/assets/imagens/cozinha.webp",
          "/assets/imagens/sala.webp",
          "/assets/imagens/jardim.webp",
        ].forEach(preload);

        function syncMuteButton() {
          const btn = document.getElementById("btn-mute");
          if (!btn) return;
          btn.textContent = muted ? "🔇 MUDO" : "🔊 SOM";
        }

        async function unlockAudio() {
          if (unlocked) return;
          unlocked = true;
          const a = bgm();
          if (!a) return;
          try {
            a.muted = true;
            a.src = "/assets/audios/sfx_click.mp3";
            await a.play();
            a.pause();
            a.currentTime = 0;
            a.muted = muted;
            a.removeAttribute("src");
            currentSrc = "";
          } catch (e) {
            unlocked = true;
          }
        }

        window.tocarSfx = function (src) {
          src = absUrl(src);
          if (!src || muted) return;
          try {
            const s = new Audio(src);
            s.volume = 0.55;
            const p = s.play();
            if (p && p.catch) p.catch(() => {});
          } catch (e) {}
        };

        window.tocarTrilha = function (src, volume) {
          src = absUrl(src);
          if (!src) return;
          const a = bgm();
          if (!a) return;
          const vol = typeof volume === "number" ? volume : 0.55;
          a.volume = muted ? 0 : vol;
          a.loop = true;
          if (currentSrc !== src) {
            currentSrc = src;
            a.src = src;
            try { a.load(); } catch (e) {}
          }
          const p = a.play();
          if (p && p.catch) p.catch(() => { unlocked = false; });
        };

        window.pararTrilha = function () {
          const a = bgm();
          if (!a) return;
          try {
            a.pause();
            a.currentTime = 0;
          } catch (e) {}
          a.removeAttribute("src");
          currentSrc = "";
        };

        window.flashDano = function () {
          if (reducedMotion || isMobile) return;
          const el = document.getElementById("flash-dano");
          if (!el) return;
          el.classList.remove("on");
          void el.offsetWidth;
          el.classList.add("on");
        };

        window.animarPainel = function () {
          if (reducedMotion || isMobile) return;
          const painel = document.getElementById("painel");
          if (!painel) return;
          painel.classList.remove("is-swap");
          void painel.offsetWidth;
          painel.classList.add("is-swap");
        };

        window.mostrarOpcoesAnimadas = function () {
          for (let i = 0; i < 4; i++) {
            const btn = document.getElementById("opt-" + i);
            if (!btn || btn.classList.contains("hidden")) continue;
            btn.classList.add("show");
          }
        };

        window.atualizarInventarioUI = function (itens) {
          const bar = document.getElementById("inv-bar");
          if (!bar) return;
          bar.innerHTML = "";
          let list = [];
          try {
            if (typeof itens === "string") list = JSON.parse(itens);
            else if (Array.isArray(itens)) list = itens;
            else if (itens && typeof itens.length === "number") list = Array.from(itens);
          } catch (e) { list = []; }
          if (!list.length) {
            const empty = document.createElement("span");
            empty.className = "inv-chip";
            empty.style.opacity = "0.55";
            empty.textContent = "inventário vazio";
            bar.appendChild(empty);
            return;
          }
          list.forEach((item) => {
            const chip = document.createElement("span");
            chip.className = "inv-chip";
            chip.textContent = String(item);
            bar.appendChild(chip);
          });
        };

        function setStageImage(img, jpgOrPath) {
          const jpg = absUrl(jpgOrPath);
          const webp = webpOf(jpg);
          img.classList.remove("hidden");
          img.classList.remove("anim-on");

          const finish = () => {
            img.classList.remove("is-fade");
            if (!reducedMotion && !isMobile) img.classList.add("anim-on");
          };

          const apply = (src) => {
            if (img.getAttribute("src") === src && img.complete && img.naturalWidth > 0) {
              finish();
              return;
            }
            const onLoad = () => {
              img.removeEventListener("load", onLoad);
              finish();
            };
            img.addEventListener("load", onLoad);
            img.onerror = function () {
              img.onerror = null;
              if (src !== jpg && jpg) {
                img.addEventListener("load", onLoad);
                img.src = jpg;
              } else {
                finish();
              }
            };
            img.src = src;
            // se já estiver em cache
            if (img.complete && img.naturalWidth > 0) onLoad();
          };

          apply(webp || jpg);
          preload(jpg);
        }

        window.aplicarMidiaCena = function (video, image, videoAutoplay) {
          const img = document.getElementById("cena-imagem");
          const vid = document.getElementById("cena-video");
          if (!img || !vid) return;
          video = absUrl(video);
          image = absUrl(image);

          img.classList.add("is-fade");
          vid.classList.add("is-fade");

          const swap = () => {
            // No mobile/desktop: usa imagem por padrão.
            // Vídeo só carrega se autoplay estiver ativo (mais leve e evita tela preta).
            const useVideo = !!(video && videoAutoplay);
            if (useVideo) {
              img.classList.add("hidden");
              img.removeAttribute("src");
              vid.classList.remove("hidden");
              if (vid.getAttribute("src") !== video) {
                vid.poster = image || "";
                vid.src = video;
                try { vid.load(); } catch (e) {}
              }
              try { vid.play(); } catch (e) {}
              img.classList.remove("is-fade");
              vid.classList.remove("is-fade");
            } else {
              try { vid.pause(); } catch (e) {}
              vid.classList.add("hidden");
              vid.removeAttribute("src");
              vid.removeAttribute("poster");
              try { vid.load(); } catch (e) {}
              setStageImage(img, image || "/assets/imagens/capa.jpg");
              vid.classList.remove("is-fade");
            }
          };

          if (isMobile || reducedMotion) swap();
          else setTimeout(swap, 120);
        };

        function wireUi() {
          const iniciar = document.getElementById("btn-iniciar");
          const continuar = document.getElementById("btn-continuar");
          const reiniciar = document.getElementById("btn-reiniciar");
          const mute = document.getElementById("btn-mute");

          async function startWithAudio(fn) {
            await unlockAudio();
            window.tocarSfx("/assets/audios/sfx_click.mp3");
            window.tocarTrilha("/assets/audios/trilha_casa.mp3", 0.55);
            if (fn) fn();
          }

          if (iniciar) {
            iniciar.addEventListener("click", () => {
              startWithAudio(() => { if (window.iniciar_jogo) window.iniciar_jogo(); });
            });
          }
          if (continuar) {
            continuar.addEventListener("click", () => {
              startWithAudio(() => { if (window.continuar_jogo) window.continuar_jogo(); });
            });
          }
          if (reiniciar) {
            reiniciar.addEventListener("click", () => {
              startWithAudio(() => { if (window.reiniciar_aventura) window.reiniciar_aventura(); });
            });
          }
          if (mute) {
            mute.addEventListener("click", () => {
              muted = !muted;
              const a = bgm();
              if (a) a.volume = muted ? 0 : 0.55;
              syncMuteButton();
              if (!muted) unlockAudio();
            });
          }

          for (let i = 0; i < 4; i++) {
            const btn = document.getElementById("opt-" + i);
            if (!btn) continue;
            btn.addEventListener("click", () => {
              const acao = btn.getAttribute("data-acao");
              window.tocarSfx("/assets/audios/sfx_click.mp3");
              if (acao && window.executar_acao_js) window.executar_acao_js(String(acao));
            });
          }
          syncMuteButton();
        }

        wireUi();
      })();
    </script>

    <script type="py" src="./main.py"></script>
  </body>
